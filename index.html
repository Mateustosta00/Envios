<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Acesso dos Setores</title>
  <link rel="stylesheet" href="inicio.css">
</head>
<body>

  <div class="caixa-central" id="caixa">
    <h1 onclick="mostrarLista()">Login</h1>

    <ul id="lista-setores">
      <li onclick="mostrarLogin('setor1')">ENFERMAGEM</li>
      <li onclick="mostrarLogin('setor2')">FARMÁCIA</li>
      <li onclick="mostrarLogin('setor3')">LABORATÓRIO</li>
    </ul>

    <div id="login-area">
      <img id="foto-setor" src="" alt="Imagem do Setor">
      <input type="password" id="senha" placeholder="Digite sua senha">

      <div class="mostrar-senha-container">
        <input type="checkbox" id="mostrarSenha" onclick="toggleSenha()">
        <label for="mostrarSenha">Mostrar senha</label>
      </div>
      
      <script>
        function toggleSenha() {
          const senhaInput = document.getElementById("senha");
          senhaInput.type = senhaInput.type === "password" ? "text" : "password";
        }
      </script>

      <button onclick="verificarSenha()">Entrar</button>
      <div id="erro-senha"></div>
    </div>
  </div>
  <div class="logo">
    <div class="cross"></div>
    <div class="letters">
     
      <div class="letter-box"><span class="letter">H</span></div>
      <div class="letter-box"><span class="letter">G</span></div>
      <div class="letter-box"><span class="letter">C</span></div>
    </div>
  </div>
   <div class="cruz"></div>

  <script src="inicio.js"></script>
</body>
</html>
